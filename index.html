<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Для тебя ❤️</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        overflow: hidden;
        background: #000;
        font-family: 'Segoe UI', system-ui, sans-serif;
      }
      canvas {
        display: block;
      }
      #overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        color: #fff;
        z-index: 10;
      }
      #overlay h1 {
        font-size: clamp(2rem, 6vw, 3.5rem);
        margin-bottom: 1rem;
        text-shadow: 0 0 20px #ff69b4, 0 0 40px #ff1493;
        letter-spacing: 2px;
      }
      #overlay p {
        max-width: 600px;
        font-size: clamp(1rem, 2.5vw, 1.3rem);
        line-height: 1.6;
        opacity: 0.9;
        text-shadow: 0 0 10px rgba(255, 105, 180, 0.8);
        padding: 0 20px;
      }
      .heart-btn {
        margin-top: 2rem;
        padding: 12px 32px;
        border: 2px solid #ff69b4;
        border-radius: 50px;
        background: rgba(255, 20, 147, 0.15);
        color: #fff;
        font-size: 1.1rem;
        cursor: pointer;
        pointer-events: auto;
        transition: all 0.3s;
        backdrop-filter: blur(8px);
      }
      .heart-btn:hover {
        background: rgba(255, 20, 147, 0.4);
        transform: scale(1.05);
        box-shadow: 0 0 25px #ff69b4;
      }
    </style>
  </head>
  <body>
    <div id="overlay">
      <h1>Для тебя ❤️</h1>
      <p>
        Для тебя, ты заставляешь моё сердце биться<br />
        по-особенному. В каждом воспоминании<br />
        и в каждом ударе — только ты.
      </p>
      <button
        class="heart-btn"
        onclick="document.getElementById('overlay').style.display='none'"
      >
        Открыть вселенную ❤️
      </button>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>

    <script type="module">
      import * as THREE from 'three';
      import { FontLoader } from 'three/addons/loaders/FontLoader.js';
      import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';

      // ========== СЦЕНА ==========
      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x000000, 0.015);

      const camera = new THREE.PerspectiveCamera(
        60,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
      );
      camera.position.set(0, 2, 28);

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      document.body.appendChild(renderer.domElement);

      // ========== СВЕТ ==========
      const ambient = new THREE.AmbientLight(0xffffff, 0.4);
      scene.add(ambient);

      const pointLight = new THREE.PointLight(0xff69b4, 2, 50);
      pointLight.position.set(0, 5, 10);
      scene.add(pointLight);

      // ========== ГЕОМЕТРИЯ СЕРДЦА ==========
      function createHeartGeometry(scale = 1) {
        const shape = new THREE.Shape();
        const x = 0;
        const y = 0;

        shape.moveTo(x + 5 * scale, y + 5 * scale);
        shape.bezierCurveTo(
          x + 5 * scale,
          y + 5 * scale,
          x + 4 * scale,
          y,
          x,
          y
        );
        shape.bezierCurveTo(
          x - 6 * scale,
          y,
          x - 6 * scale,
          y + 7 * scale,
          x - 6 * scale,
          y + 7 * scale
        );
        shape.bezierCurveTo(
          x - 6 * scale,
          y + 11 * scale,
          x - 3 * scale,
          y + 15.4 * scale,
          x + 5 * scale,
          y + 19 * scale
        );
        shape.bezierCurveTo(
          x + 12 * scale,
          y + 15.4 * scale,
          x + 16 * scale,
          y + 11 * scale,
          x + 16 * scale,
          y + 7 * scale
        );
        shape.bezierCurveTo(
          x + 16 * scale,
          y + 7 * scale,
          x + 16 * scale,
          y,
          x + 10 * scale,
          y
        );
        shape.bezierCurveTo(
          x + 7 * scale,
          y,
          x + 5 * scale,
          y + 5 * scale,
          x + 5 * scale,
          y + 5 * scale
        );

        const extrudeSettings = {
          depth: 2 * scale,
          bevelEnabled: true,
          bevelSegments: 3,
          steps: 2,
          bevelSize: 0.8 * scale,
          bevelThickness: 0.8 * scale
        };

        return new THREE.ExtrudeGeometry(shape, extrudeSettings);
      }

      // ========== МАТЕРИАЛ ==========
      const heartMat = new THREE.MeshStandardMaterial({
        color: 0xff1493,
        emissive: 0xff0066,
        emissiveIntensity: 0.6,
        metalness: 0.3,
        roughness: 0.4,
        side: THREE.DoubleSide
      });

      // ========== МАССИВ СЕРДЕЦ ==========
      const heartGroup = [];
      const heartGeo = createHeartGeometry(0.15);

      for (let i = 0; i < 80; i++) {
        const heartMesh = new THREE.Mesh(heartGeo, heartMat.clone());

        heartMesh.userData = {
          radius: 4 + Math.random() * 14,
          angle: Math.random() * Math.PI * 2,
          ySpeed: 0.006 + Math.random() * 0.012,
          yOffset: (Math.random() - 0.5) * 6,
          rotSpeed: (Math.random() - 0.5) * 0.03
        };

        heartMesh.position.x =
          Math.cos(heartMesh.userData.angle) * heartMesh.userData.radius;
        heartMesh.position.z =
          Math.sin(heartMesh.userData.angle) * heartMesh.userData.radius;
        heartMesh.position.y = heartMesh.userData.yOffset;

        // немного разный размер
        const s = 0.6 + Math.random() * 0.8;
        heartMesh.scale.set(s, s, s);

        scene.add(heartMesh);
        heartGroup.push(heartMesh);
      }

      // ========== ЦЕНТРАЛЬНОЕ БОЛЬШОЕ СЕРДЦЕ ==========
      const bigHeart = new THREE.Mesh(createHeartGeometry(0.6), heartMat.clone());
      bigHeart.material.emissiveIntensity = 1.2;
      bigHeart.position.set(0, 3, 0);
      bigHeart.rotation.z = Math.PI;
      scene.add(bigHeart);

      // ========== ЧАСТИЦЫ (галактика) ==========
      const particlesCount = 3000;
      const positions = new Float32Array(particlesCount * 3);
      const colors = new Float32Array(particlesCount * 3);

      for (let i = 0; i < particlesCount; i++) {
        const r = Math.random() * 40;
        const theta = Math.random() * Math.PI * 2;
        const y = (Math.random() - 0.5) * 20;

        positions[i * 3] = Math.cos(theta) * r;
        positions[i * 3 + 1] = y;
        positions[i * 3 + 2] = Math.sin(theta) * r;

        // розовые оттенки
        colors[i * 3] = 1;
        colors[i * 3 + 1] = 0.2 + Math.random() * 0.4;
        colors[i * 3 + 2] = 0.5 + Math.random() * 0.5;
      }

      const particleGeo = new THREE.BufferGeometry();
      particleGeo.setAttribute(
        'position',
        new THREE.BufferAttribute(positions, 3)
      );
      particleGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      const particleMat = new THREE.PointsMaterial({
        size: 0.12,
        vertexColors: true,
        transparent: true,
        opacity: 0.8,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      const particles = new THREE.Points(particleGeo, particleMat);
      scene.add(particles);

      // ========== РУССКИЕ ФРАЗЫ ==========
      const phrases = [
        'ЛЮБОВЬ МОЕЙ ЖИЗНИ',
        'БЕСКОНЕЧНАЯ ЛЮБОВЬ',
        'СЧАСТЛИВОГО ДНЯ',
        'ТЫ — МОЁ ВСЁ',
        'ПРАЗДНУЕМ ЛЮБОВЬ',
        'ДЛЯ ТЕБЯ',
        'МОЁ СЕРДЦЕ',
        'НАВСЕГДА ВМЕСТЕ',
        'ТЫ В МОЁМ СЕРДЦЕ',
        'ЛЮБЛЮ ТЕБЯ'
      ];

      // Простые текстовые спрайты (чтобы не грузить шрифт)
      function createTextSprite(text) {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 512;
        canvas.height = 128;

        ctx.fillStyle = 'rgba(0,0,0,0)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.font = 'bold 48px Arial';
        ctx.fillStyle = '#ff69b4';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowColor = '#ff1493';
        ctx.shadowBlur = 15;
        ctx.fillText(text, 256, 64);

        const texture = new THREE.CanvasTexture(canvas);
        const material = new THREE.SpriteMaterial({
          map: texture,
          transparent: true,
          opacity: 0.9,
          blending: THREE.AdditiveBlending
        });

        const sprite = new THREE.Sprite(material);
        sprite.scale.set(8, 2, 1);
        return sprite;
      }

      const textGroup = [];
      phrases.forEach((text, i) => {
        const sprite = createTextSprite(text);
        const angle = (i / phrases.length) * Math.PI * 2;
        const radius = 12 + Math.random() * 6;

        sprite.position.set(
          Math.cos(angle) * radius,
          (Math.random() - 0.5) * 8,
          Math.sin(angle) * radius
        );

        sprite.userData = {
          angle: angle,
          radius: radius,
          ySpeed: 0.003 + Math.random() * 0.008,
          baseY: sprite.position.y
        };

        scene.add(sprite);
        textGroup.push(sprite);
      });

      // ========== АНИМАЦИЯ ==========
      let time = 0;

      function animate() {
        requestAnimationFrame(animate);
        time += 0.01;

        // вращение маленьких сердец
        heartGroup.forEach((heart) => {
          heart.userData.angle += 0.003;
          heart.position.x =
            Math.cos(heart.userData.angle) * heart.userData.radius;
          heart.position.z =
            Math.sin(heart.userData.angle) * heart.userData.radius;
          heart.position.y =
            heart.userData.yOffset +
            Math.sin(time * 2 + heart.userData.angle) * 1.5;

          heart.rotation.y += heart.userData.rotSpeed;
          heart.rotation.z = Math.sin(time + heart.userData.angle) * 0.3;
        });

        // большое сердце пульсирует
        const pulse = 1 + Math.sin(time * 3) * 0.08;
        bigHeart.scale.set(pulse, pulse, pulse);
        bigHeart.rotation.y = time * 0.3;

        // частицы медленно вращаются
        particles.rotation.y = time * 0.05;

        // тексты плавают
        textGroup.forEach((sprite) => {
          sprite.userData.angle += 0.002;
          sprite.position.x =
            Math.cos(sprite.userData.angle) * sprite.userData.radius;
          sprite.position.z =
            Math.sin(sprite.userData.angle) * sprite.userData.radius;
          sprite.position.y =
            sprite.userData.baseY +
            Math.sin(time * 1.5 + sprite.userData.angle) * 1.2;
        });

        // лёгкое покачивание камеры
        camera.position.x = Math.sin(time * 0.2) * 2;
        camera.lookAt(0, 2, 0);

        renderer.render(scene, camera);
      }

      animate();

      // ========== РЕЗИЗ ==========
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>
  </body>
</html>
